<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BTC Deribit 期权 · 持仓与成交记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="app" class="max-w-5xl mx-auto px-6 py-12">
    <p class="text-slate-400 text-center py-20">加载中...</p>
  </div>
  <script>
  fetch('deribit_snapshot.json?' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById('app').innerHTML =
        '<a href="../" class="text-sm text-slate-400 hover:text-slate-200">&larr; 返回策略总览</a>'
        + '<p class="text-rose-400 text-center py-20">持仓数据加载失败</p>';
    });

  function fmtUsd(n) {
    return (n < 0 ? '&minus;$' : '$') + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
  }
  function fmtBtc(n) {
    return (n >= 0 ? '+' : '') + n.toFixed(6) + ' BTC';
  }
  function pnlClass(n) { return n >= 0 ? 'text-emerald-400' : 'text-rose-400'; }
  function dirZh(d) { return d === 'sell' ? ['卖出（收权利金）', 'text-emerald-400'] : ['买入', 'text-sky-400']; }

  function render(d) {
    var updated = new Date(d.updated_at_utc).toLocaleString('zh-CN', { timeZone: 'Asia/Hong_Kong', hour12: false });

    var posRows = d.open_positions.map(function (p) {
      var di = dirZh(p.direction);
      return '<tr class="border-b border-slate-800">'
        + '<td class="px-4 py-3 text-slate-200 font-medium num">' + p.instrument + '</td>'
        + '<td class="px-4 py-3 ' + di[1] + '">' + di[0] + '</td>'
        + '<td class="px-4 py-3 num text-slate-300">' + p.size + '</td>'
        + '<td class="px-4 py-3 num text-slate-300">' + p.mark_price + ' BTC</td>'
        + '<td class="px-4 py-3 num ' + pnlClass(p.unrealized_pnl) + '">' + fmtBtc(p.unrealized_pnl) + '</td>'
        + '</tr>';
    }).join('');

    document.getElementById('app').innerHTML = ''
      + '<a href="../" class="text-sm text-slate-400 hover:text-slate-200">&larr; 返回策略总览</a>'

      + '<header class="mt-6 mb-10">'
      + '  <div class="flex items-baseline gap-3 flex-wrap">'
      + '    <h1 class="text-4xl font-bold tracking-tight">BTC Deribit 期权</h1>'
      + '    <span class="inline-flex items-center gap-1.5 text-sm px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">'
      + '      <span class="relative flex h-2 w-2">'
      + '        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>'
      + '        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>'
      + '      </span>'
      + '      实盘'
      + '    </span>'
      + '  </div>'
      + '  <p class="text-slate-500 text-sm mt-2">数据来自 Deribit 只读 API 快照 &middot; 更新于 ' + updated + ' (HKT)</p>'
      + '</header>'

      + '<section class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-12">'
      + '  <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-5">'
      + '    <div class="text-xs text-slate-500 mb-1">已投入资金</div>'
      + '    <div class="text-2xl font-bold num">' + fmtUsd(d.equity_usd) + '</div>'
      + '  </div>'
      + '  <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-5">'
      + '    <div class="text-xs text-slate-500 mb-1">BTC 计价权益</div>'
      + '    <div class="text-2xl font-bold num">' + d.equity_btc + ' &#8383;</div>'
      + '  </div>'
      + '  <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-5">'
      + '    <div class="text-xs text-slate-500 mb-1">当前持仓数</div>'
      + '    <div class="text-2xl font-bold num">' + d.open_position_count + '</div>'
      + '  </div>'
      + '</section>'

      + '<section class="mb-12">'
      + '  <h2 class="text-lg font-semibold text-slate-200 mb-4">当前持仓</h2>'
      + '  <div class="rounded-xl border border-slate-800 bg-slate-900/50 overflow-x-auto">'
      + '    <table class="w-full text-sm min-w-[640px]">'
      + '      <thead><tr class="text-left text-xs text-slate-500 border-b border-slate-800">'
      + '        <th class="px-4 py-3 font-normal">合约</th>'
      + '        <th class="px-4 py-3 font-normal">方向</th>'
      + '        <th class="px-4 py-3 font-normal">数量</th>'
      + '        <th class="px-4 py-3 font-normal">标记价格</th>'
      + '        <th class="px-4 py-3 font-normal">浮动盈亏</th>'
      + '      </tr></thead>'
      + '      <tbody>' + posRows + '</tbody>'
      + '    </table>'
      + '  </div>'
      + '</section>'

      + '<section class="mb-12">'
      + '  <h2 class="text-lg font-semibold text-slate-200 mb-4">近 10 笔成交</h2>'
      + '  <div id="trade-history" class="rounded-xl border border-dashed border-slate-800 bg-slate-900/30 p-8 text-center text-sm text-slate-500">'
      + '    成交记录截图即将上传'
      + '  </div>'
      + '</section>'

      + '<footer class="border-t border-slate-800 pt-6 mt-10">'
      + '  <p class="text-xs text-slate-500">持仓与权益数据通过只读 API 密钥获取，仅展示衍生的展示数值，不包含账户 ID 或其他身份信息。</p>'
      + '</footer>';
  }
  </script>
</body>
</html>
